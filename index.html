<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuldeep Singh Sidhu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111111;
            --text-color: #f5f5f5;
            --highlight-color: #fbbf24;
            /* Warm yellow/gold like reference */
            --muted-color: #a3a3a3;
            --link-color: #d4d4d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            /* Increased to allow single line text */
            width: 100%;
        }

        h1 {
            font-size: 1.7rem;
            /* Fixed smaller size to match reference elegance */
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            /* Space after the first block */
            max-width: 100%;
        }

        div.intro-text {
            font-size: 1.7rem;
            font-weight: 400;
            line-height: 1.3;
            /* Tighter line height */
            margin-bottom: 1rem;
            /* Much tighter spacing between blocks */
            color: var(--text-color);
        }

        .highlight {
            color: var(--highlight-color);
            font-weight: 500;
        }

        a.highlight-link {
            color: var(--highlight-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        a.highlight-link:hover {
            border-bottom-color: var(--highlight-color);
        }

        .divider {
            height: 1px;
            background-color: #333;
            margin: 1.5rem 0;
            /* Reduced from 2rem */
            width: 100%;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5rem;
            font-size: 1.1rem;
            /* Slightly larger links */
            font-weight: 300;
            color: var(--muted-color);
        }

        .links a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.2s;
            position: relative;
        }

        .links a:hover {
            color: #fff;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        .footer-container {
            position: absolute;
            bottom: 3rem;
            left: 0;
            width: 100%;
            padding: 0 10%;
            /* Match body padding to align left */
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .footer-social-links {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            font-weight: 300;
        }

        .footer-social-links a {
            color: #777;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-social-links a:hover {
            color: var(--highlight-color);
        }

        .copyright {
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .copyright a {
            color: #555;
            text-decoration: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                padding: 0 2rem;
                height: 100vh;
                /* Keep view height */
            }

            .container {
                margin-top: -100px;
                /* Lift content slightly to make room for footer */
            }

            .links {
                gap: 1.5rem;
                flex-direction: column;
                /* Stack links on very small screens if needed, or keep row */
            }

            h1 {
                margin-bottom: 1.5rem;
            }

            .footer-container {
                padding: 0 2rem;
                bottom: 2rem;
            }
        }

        /* Sick Animations */
        @keyframes reveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .intro-text,
        .divider,
        .links a,
        .footer-container {
            opacity: 0;
            animation: reveal 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            /* Slower duration */
        }

        .intro-text:nth-child(1) {
            animation-delay: 0.15s;
        }

        .intro-text:nth-child(2) {
            animation-delay: 0.35s;
        }

        .divider {
            animation-delay: 0.6s;
        }

        .links a:nth-child(1) {
            animation-delay: 0.7s;
        }

        .links a:nth-child(2) {
            animation-delay: 0.8s;
        }

        .footer-container {
            animation-delay: 1.0s;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="intro-text">
            Hi this is <span class="highlight">Kuldeep</span>, thank you for reaching out to me!
        </div>
        <div class="intro-text">
            If I can help you or your organisation, please connect with me on <a
                href="https://www.linkedin.com/in/singhsidhukuldeep/" class="highlight-link">LinkedIn</a>
        </div>

        <div class="divider"></div>

        <nav class="links">
            <a href="https://dsprep.com/" target="_blank">Crack DS Interviews</a>
            <a href="https://OnlineToolsVault.com" target="_blank">Your Everyday Tools</a>
        </nav>
    </div>

    <footer class="footer-container">
        <nav class="footer-social-links">
            <a href="https://www.linkedin.com/in/singhsidhukuldeep/" target="_blank">LinkedIn</a>
            <a href="https://github.com/singhsidhukuldeep" target="_blank">GitHub</a>
            <a href="http://kuldeepsinghsidhu.com/" target="_blank">Website</a>
            <a href="https://twitter.com/kuldeep_s_s" target="_blank">Twitter</a>
        </nav>
        <div class="copyright">
            &copy; COPYRIGHT 2024 - <span id="year"></span>: <a href="#">&lt;/KULDEEP SINGH SIDHU&gt;</a>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Interaction Script
        const container = document.querySelector('.container');
        const footer = document.querySelector('.footer-container');

        // Desktop: Mouse Movement
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 50;
            const y = (window.innerHeight / 2 - e.clientY) / 50;

            container.style.transform = `translate(${x}px, ${y}px)`;
            footer.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Mobile: Device Orientation (Gyroscope)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                // Gamma is left/right tilt (-90 to 90)
                // Beta is front/back tilt (-180 to 180)
                const x = (e.gamma) / 4;
                const y = (e.beta - 45) / 4; // Subtract 45 to account for natural holding angle

                container.style.transform = `translate(${x}px, ${y}px)`;
                footer.style.transform = `translate(${x}px, ${y}px)`;
            });
        }
    </script>

</body>

</html>
